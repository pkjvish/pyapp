name: python with flask
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check Runner IP
        run: curl https://api.ipify.org
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gunicorn flask
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Deploy and Expose
        run: |
          # 1. Force kill anything on port 5000
          sudo lsof -t -i:5000 | xargs -r sudo kill -9 || true

          # 2. Install LocalTunnel via npm (standard on GitHub runners)
          sudo npm install -g localtunnel

          # 3. Start Gunicorn in background
          # Ensure your file is app.py and flask variable is app
          gunicorn --bind 0.0.0.0:5000 app:app &

          # 4. Wait for Gunicorn to stabilize
          sleep 10

          # 5. Create Public Tunnel
          # This will print your public URL in the logs
          lt --port 5000
