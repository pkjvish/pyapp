name: python with flask
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check Runner IP
        run: curl https://api.ipify.org
        
      - name: Checkout repository
        uses: actions/checkout@v4  # Pulls your code onto the runner

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # Specify your preferred version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Check Runner IP
        run: curl https://api.ipify.org

      - name: Print Runner Public IP
        run: |
          echo "The Runner's Public IP is:"
          curl https://ipify.org
          echo ""

      - name: Expose App to External World
        run: |
          # 1. Kill process only if it exists (prevents Exit Code 1)
          sudo lsof -t -i:5000 | xargs -r sudo kill -9 || true
          
          # 3. Start your app in the background
          echo "Starting Gunicorn..."
          gunicorn --bind 0.0.0.0:5000 app:app &
          
          # 4. Give the app 5 seconds to start up
          sleep 10

      
