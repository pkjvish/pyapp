name: python with flask
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check Runner IP
        run: curl https://api.ipify.org
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gunicorn flask
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Start MySQL Service
        run: |
          # 1. Start MySQL service
          sudo systemctl start mysql
          
          # 2. Create the Database and Table directly as sudo (no password needed)
          sudo mysql -e "CREATE DATABASE IF NOT EXISTS crud_db;"
          sudo mysql -e "USE crud_db; CREATE TABLE IF NOT EXISTS tbl_user (user_id INT AUTO_INCREMENT PRIMARY KEY, user_name VARCHAR(45) NOT NULL, user_email VARCHAR(45) NOT NULL);"
          
          # 3. Create a dedicated app user so Flask doesn't need 'root'
          sudo mysql -e "CREATE USER 'app_user'@'localhost' IDENTIFIED BY 'password';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON crud_db.* TO 'app_user'@'localhost'; FLUSH PRIVILEGES;"
          
          # 4. Wait for the app to initialize
          sleep 20

      - name: Deploy and Expose
        run: |
          # 1. Force kill anything on port 5000
          sudo lsof -t -i:5000 | xargs -r sudo kill -9 || true

          # 4. Wait for Gunicorn to stabilize
          sleep 10

          # 2. Install LocalTunnel
          sudo npm install -g localtunnel

          # 3. RUN THE APP DIRECTLY (This replaces Gunicorn)
          python app.py &

          # 4. Wait for the app to initialize
          sleep 10

          # 5. Start the tunnel
          lt --port 5000
