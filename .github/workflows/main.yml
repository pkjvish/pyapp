name: python with flask
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gunicorn flask
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Print Runner IP
        run: |
          echo "GitHub Runner Public IP:"
          curl -s https://api.ipify.org
          echo ""

      - name: Deploy and Expose
        run: |
          # 1. Clear port 5000
          sudo lsof -t -i:5000 | xargs -r sudo kill -9 || true

          # 2. Install Ngrok
          curl -s https://amazonaws.com | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok

          # 3. Start Gunicorn in background
          gunicorn --bind 0.0.0.0:5000 app:app &

          # 4. Wait for Gunicorn to start
          sleep 5

          # 5. Start Tunnel (Requires no auth for basic use, but limited)
          # This will output your public URL in the logs
          echo "Creating Public Tunnel..."
          ngrok http 5000
