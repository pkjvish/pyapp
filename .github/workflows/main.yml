name: python with flask
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Greet the user
        run: echo "Hello, GitHub Actions!"
      - name: Checkout repository
        uses: actions/checkout@v4  # Pulls your code onto the runner

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # Specify your preferred version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Check Runner IP
        run: curl https://api.ipify.org

      - name: Print Runner Public IP
        run: |
          echo "The Runner's Public IP is:"
          curl https://ipify.org
          echo ""

      - name: Expose App to External World
        run: |
          # Start Gunicorn on port 5000
          # Note: 'app:app' assumes your file is app.py and flask variable is app
          gunicorn --bind 0.0.0.0:5000 app:app & 
          
      - name: Run script
        run: python app.py 
      
