name: python with flask
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Greet the user
        run: echo "Hello, GitHub Actions!"
      - name: Checkout repository
        uses: actions/checkout@v4  # Pulls your code onto the runner

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # Specify your preferred version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Check Runner IP
        run: curl https://api.ipify.org

      - name: Print Runner Public IP
        run: |
          echo "The Runner's Public IP is:"
          curl https://ipify.org
          echo ""

      - name: Expose App to External World
        run: |
          # 1. Force kill anything on port 5000 using lsof
          echo "Checking for processes on port 5000..."
          PORT_PID=$(sudo lsof -t -i:5000)
          if [ -z "$PORT_PID" ]; then
            echo "Port 5000 is clear."
          else
            echo "Killing process $PORT_PID on port 5000..."
            sudo kill -9 $PORT_PID || true
          fi

          # 3. Start Gunicorn in background
          # We use Gunicorn because it is production-ready
          echo "Starting Gunicorn..."
          gunicorn --bind 0.0.0.0:5000 app:app &

          # 4. Wait a few seconds for Gunicorn to wake up
          sleep 5

      
